[project]
name = "crabook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zrsq", email = "zrsqbk@gmail.com" }
]
requires-python = ">=3.11, <3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chardet>=7.7.0",
    "ebooklib>=0.21",
    "lxml>=6.1.3",
    "natasha>=1.6.0",
    "noisereduce>=3.0.3",
    "num2words>=0.5.14",
    "numpy>=2.4.6",
    "omegaconf>=2.4.0",
    "onnxruntime>=1.31.1",
    "pdfplumber>=0.11.10",
    "pydub>=0.25.1",
    "pyloudnorm>=0.2.0",
    "python-docx>=1.2.0",
    "ruaccent>=1.5",
    "scipy>=1.17.1",
    "torch>=2.2.0",
]

[project.scripts]
crabook = "crabook:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
